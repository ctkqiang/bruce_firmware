name: Release — Nezha Cyber Firmware

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*"
  workflow_call:
    inputs:
      tag:
        description: "Release tag created by CI (e.g. v1.1.0)"
        required: true
        type: string
      prev_tag:
        description: "Previous release tag for changelog comparison"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark as GitHub Pre-release"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create as Draft Release"
        required: false
        default: false
        type: boolean
      skip_verify:
        description: "Skip duplicate unit-test gate when already passed in caller CI"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create & publish (e.g. v1.1.0 or v1.2.0-beta.1)"
        required: true
        type: string
      prerelease:
        description: "Mark as GitHub Pre-release"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create as Draft Release (review before publishing)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prev_tag: ${{ steps.meta.outputs.prev_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Enforce main branch on manual dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Manual releases must be triggered from the main branch (got ${GITHUB_REF})."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve & validate release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PREV_TAG: ${{ inputs.prev_tag }}
          INPUT_PRE: ${{ inputs.prerelease }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+'; then
            echo "::error::Release tag must match v<major>.<minor>... (got '$TAG')."
            exit 1
          fi
          IS_PRE="${INPUT_PRE:-false}"
          if [[ "$TAG" == *-* ]]; then
            IS_PRE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$INPUT_PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"

      - name: Verify i18n, build scripts & unit tests
        if: inputs.skip_verify != true
        run: |
          python3 tools/gen_cjk_font.py --check-tables
          python3 -m py_compile scripts/build/*.py tools/gen_cjk_font.py tools/gen_web_manifests.py tools/hil_smoke_test.py
          python3 tools/hil_smoke_test.py --mock
          bash test/run_tests.sh

  build:
    name: Build Group (${{ matrix.group }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: esp32s3-lilygo
            boards: '[{"env":"lilygo-t-deck","board":"LilyGO T-Deck","mcu":"esp32s3","flash":"16MB","flash_mb":16,"psram":"8MB PSRAM","edition":"full","partition":"partitions/custom_16Mb.csv"},{"env":"lilygo-t-deck-pro","board":"LilyGO T-Deck Plus","mcu":"esp32s3","flash":"16MB","flash_mb":16,"psram":"8MB PSRAM","edition":"full","partition":"partitions/custom_16Mb.csv"},{"env":"lilygo-t-embed-cc1101","board":"LilyGO T-Embed CC1101","mcu":"esp32s3","flash":"16MB","flash_mb":16,"psram":"8MB PSRAM","edition":"full","partition":"partitions/custom_16Mb.csv"},{"env":"lilygo-t-embed","board":"LilyGO T-Embed","mcu":"esp32s3","flash":"16MB","flash_mb":16,"psram":"8MB PSRAM","edition":"full","partition":"partitions/custom_16Mb.csv"}]'
          - group: esp32s3-m5stack
            boards: '[{"env":"m5stack-cardputer","board":"M5Stack Cardputer","mcu":"esp32s3","flash":"8MB","flash_mb":8,"psram":"None","edition":"standard","partition":"partitions/custom_8Mb.csv"},{"env":"m5stack-cores3","board":"M5Stack CoreS3","mcu":"esp32s3","flash":"16MB","flash_mb":16,"psram":"8MB PSRAM","edition":"full","partition":"partitions/custom_16Mb.csv"}]'
          - group: esp32-full
            boards: '[{"env":"m5stack-core2","board":"M5Stack Core2","mcu":"esp32","flash":"16MB","flash_mb":16,"psram":"8MB PSRAM","edition":"full","partition":"partitions/custom_16Mb.csv"},{"env":"m5stack-cplus2","board":"M5StickC Plus2","mcu":"esp32","flash":"8MB","flash_mb":8,"psram":"2MB PSRAM","edition":"standard","partition":"partitions/custom_8Mb.csv"},{"env":"m5stack-cplus1_1","board":"M5StickC Plus 1.1","mcu":"esp32","flash":"4MB","flash_mb":4,"psram":"None","edition":"compact","partition":"partitions/custom_4Mb_full.csv"},{"env":"CYD-2432S028","board":"CYD-2432S028 (2.8\")","mcu":"esp32","flash":"4MB","flash_mb":4,"psram":"None","edition":"compact","partition":"partitions/custom_4Mb_full.csv"}]'
          - group: esp32-launcher
            boards: '[{"env":"LAUNCHER_m5stack-cplus1_1","board":"M5StickC Plus 1.1 (Launcher)","mcu":"esp32","flash":"4MB","flash_mb":4,"psram":"None","edition":"lite","partition":"partitions/custom_4Mb.csv"},{"env":"LAUNCHER_CYD-2432S028","board":"CYD-2432S028 (Launcher)","mcu":"esp32","flash":"4MB","flash_mb":4,"psram":"None","edition":"lite","partition":"partitions/custom_4Mb.csv"}]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache PlatformIO toolchain (shared across boards & workflows)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-toolchain-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-toolchain-${{ runner.os }}-

      - name: Cache group libdeps & object buildcache
        uses: actions/cache@v6
        with:
          path: |
            .pio/libdeps
            .pio/buildcache
          key: pio-rel-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('platformio.ini', 'boards/**/*.ini') }}
          restore-keys: |
            pio-rel-${{ runner.os }}-${{ matrix.group }}-

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check --no-warn-script-location "platformio>=6.1,<7"

      - name: Build & package boards with memory telemetry in ${{ matrix.group }}
        env:
          BOARDS_JSON: ${{ matrix.boards }}
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          def read_app_part_bytes(csv_path: Path) -> int:
              if not csv_path.is_file():
                  return 0
              with csv_path.open(newline="", encoding="utf-8") as f:
                  for row in csv.reader(f):
                      if not row or row[0].strip().startswith("#") or len(row) < 5:
                          continue
                      if row[2].strip().lower() in ("factory", "ota_0"):
                          s = row[4].strip().upper()
                          if s.endswith("K"):
                              return int(s[:-1], 0) * 1024
                          if s.endswith("M"):
                              return int(s[:-1], 0) * 1024 * 1024
                          return int(s, 0)
              return 0

          boards = json.loads(os.environ["BOARDS_JSON"])
          dist = Path("dist")
          dist.mkdir(exist_ok=True)

          ram_re = re.compile(r"RAM:\s+\[[^\]]+\]\s+([0-9.]+)%\s+\(used\s+(\d+)\s+bytes\s+from\s+(\d+)\s+bytes\)")

          for item in boards:
              env_name = item["env"]
              flash_mb = int(item["flash_mb"])
              flash_bytes = flash_mb * 1024 * 1024
              part_path = Path(item["partition"])
              app_part_bytes = read_app_part_bytes(part_path)

              print(f"\n=== Building {item['board']} ({env_name} · {flash_mb}MB {item['edition']}) ===", flush=True)
              proc = subprocess.run(
                  ["pio", "run", "-e", env_name],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  check=False,
              )
              print(proc.stdout, flush=True)
              if proc.returncode != 0:
                  raise SystemExit(proc.returncode)

              ram_used = 0
              ram_total = 0
              ram_pct = None
              m = ram_re.search(proc.stdout)
              if m:
                  ram_pct = float(m.group(1))
                  ram_used = int(m.group(2))
                  ram_total = int(m.group(3))

              factory_src = Path(f"NezhaCyber-{env_name}.bin")
              if not factory_src.is_file():
                  raise FileNotFoundError(f"Expected merged binary not found: {factory_src}")
              factory_size = factory_src.stat().st_size
              if factory_size > flash_bytes:
                  raise RuntimeError(
                      f"{env_name} merged binary ({factory_size:,} B) exceeds {flash_mb}MB flash limit ({flash_bytes:,} B)!"
                  )
              shutil.copy2(factory_src, dist / factory_src.name)

              ota_src = Path(".pio") / "build" / env_name / "firmware.bin"
              ota_name = f"NezhaCyber-{env_name}-ota.bin"
              if ota_src.is_file():
                  ota_size = ota_src.stat().st_size
                  if app_part_bytes > 0 and ota_size > app_part_bytes:
                      raise RuntimeError(
                          f"{env_name} app binary ({ota_size:,} B) exceeds partition limit ({app_part_bytes:,} B)!"
                      )
                  shutil.copy2(ota_src, dist / ota_name)

              meta = {
                  "env": env_name,
                  "board": item["board"],
                  "mcu": item["mcu"],
                  "flash": item["flash"],
                  "flash_mb": flash_mb,
                  "flash_bytes": flash_bytes,
                  "psram": item.get("psram", "None"),
                  "edition": item["edition"],
                  "partition": item["partition"],
                  "app_partition_bytes": app_part_bytes,
                  "ram_used_bytes": ram_used,
                  "ram_total_bytes": ram_total,
                  "ram_usage_pct": ram_pct,
                  "factory_bin": factory_src.name,
                  "ota_bin": ota_name,
              }
              (dist / f"meta-{env_name}.json").write_text(
                  json.dumps(meta, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
              )

              # Reclaim per-env build objects while preserving shared .pio/buildcache
              shutil.rmtree(Path(".pio") / "build" / env_name, ignore_errors=True)
          PY

      - name: Upload built firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-bin-${{ matrix.group }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Package & Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release packaging scripts, partitions, sd_files & git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          sparse-checkout: |
            scripts/build
            partitions
            sd_files

      - name: Ensure annotated Git tag exists on origin
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git config user.name "nezha-cyber-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Nezha Cyber (哪吒网络安全) $RELEASE_TAG"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Download all built firmware artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: release-bin-*
          merge-multiple: true

      - name: Bundle microSD reference files
        run: |
          if [ -d sd_files ]; then
            zip -r -q release-assets/NezhaCyber-sd-files.zip sd_files
          fi

      - name: Generate SHA256SUMS.txt, manifest.json & rich Release Notes with changelog + memory table
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          PREV_TAG: ${{ needs.verify.outputs.prev_tag }}
          RELEASE_CHANNEL: ${{ needs.verify.outputs.is_prerelease == 'true' && 'beta' || 'stable' }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 scripts/build/package_release.py \
            --assets-dir release-assets \
            --tag "$RELEASE_TAG" \
            --prev-tag "$PREV_TAG" \
            --repo-dir . \
            --channel "$RELEASE_CHANNEL" \
            --repo "$REPO_NAME" \
            --notes-out RELEASE_NOTES.md
          test -s release-assets/manifest.json
          test -s release-assets/SHA256SUMS.txt
          test -s RELEASE_NOTES.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: "🔥 Nezha Cyber (哪吒网络安全) ${{ needs.verify.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          draft: ${{ inputs.draft == true }}
          prerelease: ${{ needs.verify.outputs.is_prerelease == 'true' }}
          make_latest: ${{ (needs.verify.outputs.is_prerelease != 'true' && inputs.draft != true) && 'true' || 'false' }}
          fail_on_unmatched_files: false
          files: |
            release-assets/NezhaCyber-*.bin
            release-assets/NezhaCyber-sd-files.zip
            release-assets/manifest.json
            release-assets/SHA256SUMS.txt
